[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "concierge-voz-autos"
version = "0.1.0"
description = "Grounded Spanish voice concierge built with ElevenLabs Agents and FastAPI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "elevenlabs==2.78.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
media = ["pillow>=11,<14", "imageio-ffmpeg>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["inventory*", "evals*", "scripts*"]

[tool.setuptools.package-data]
inventory = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
